[package]
name = "kernel-occt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs carries the bridge: the session registry, the per-session
# lock and every buffer live here, where ownership is checked by the
# compiler. C++ keeps only the OCCT calls.
napi = { version = "2", default-features = false, features = ["napi8", "async"] }
napi-derive = "2"
parking_lot = "0.12"

[build-dependencies]
napi-build = "2"
cc = "1"

[profile.release]
lto = true
codegen-units = 1
# OCCT signals failure by throwing, and the shim's catch must survive.
# Aborting would turn a recoverable modelling error into a dead process
# that takes every other session with it.
panic = "unwind"
