[package]
name = "kernel-occt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs over C++ N-API: Result<T, E> maps directly onto our
# KernelResult, and it is far harder to take down the process by
# accident.
napi = { version = "2", default-features = false, features = ["napi8", "async"] }
napi-derive = "2"
parking_lot = "0.12"   # the per-session mutex

[build-dependencies]
napi-build = "2"
cc = "1"

[profile.release]
lto = true
codegen-units = 1
# OCCT signals failure by throwing; unwinding must survive to our
# catch. Aborting on panic would turn a recoverable modelling error
# into a dead process.
panic = "unwind"
