packages:
  - "apps/*"
  - "packages/*"

# One version per dependency, declared once. Every package references
# `catalog:` instead of a range, so a bump happens in exactly one place
# and two packages can never drift onto different versions of Solid.
catalog:
  # --- solid ----------------------------------------------------------
  solid-js: ^1.9.3
  "@solidjs/router": ^0.15.3
  vite-plugin-solid: ^2.11.0

  # --- ui -------------------------------------------------------------
  # Ark UI is headless: behaviour, accessibility and state, with no
  # styling of its own. That matters for a CAD panel, which has to look
  # like the product rather than like a component library.
  "@ark-ui/solid": ^4.9.0
  "lucide-solid": ^0.469.0

  # --- build ----------------------------------------------------------
  vite: ^6.0.7
  typescript: ^5.7.2
  "@types/node": ^22.10.5

  # --- test -----------------------------------------------------------
  vitest: ^4.1.10
  # Component tests render Solid into a DOM (happy-dom) and drive it with
  # the testing library, the same stack the reference project uses.
  "@solidjs/testing-library": ^0.8.10
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/user-event": ^14.6.1
  happy-dom: ^20.10.6

  # --- server ---------------------------------------------------------
  ws: ^8.18.0
  "@types/ws": ^8.5.13
  isomorphic-git: ^1.27.2
  zod: ^3.24.1
